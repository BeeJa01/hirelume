<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your result | HireLume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif; --font-display: "Poppins", ui-sans-serif, system-ui, sans-serif; --color-brand: #2563eb; --color-brand-dark: #1d4ed8; --color-line: #e2e8f0; }
  </style>
</head>
<body class="bg-[#f8fafc] font-sans text-black antialiased">
  <header class="border-b border-line bg-white"><div class="mx-auto flex max-w-3xl items-center justify-between px-5 py-4">
    <a href="/landingpage.html" class="font-display text-lg font-bold">Hire<span class="text-brand">Lume</span></a>
    <a href="/login.html" class="text-sm text-gray-500 hover:text-black">Log in</a>
  </div></header>
  <main class="mx-auto max-w-3xl px-5 py-8">
    <h1 class="font-display text-2xl font-bold">Your result</h1>
    <p id="state" class="mt-6 text-sm text-gray-500">Loading...</p>
    <div id="out" class="mt-4 space-y-4"></div>
  </main>
  <script src="/api.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const out = document.getElementById("out"), state = document.getElementById("state");
    const list = (a) => '<ul class="mt-2 list-disc space-y-1 pl-5 text-sm text-gray-700">' + a.map((x) => "<li>" + esc(typeof x === "string" ? x : JSON.stringify(x)) + "</li>").join("") + "</ul>";
    const card = (t, body) => '<section class="rounded-2xl border border-line bg-white p-5"><h2 class="font-semibold">' + t + "</h2>" + body + "</section>";
    let timer;
    async function get() {
      const url = API_BASE + ENDPOINTS.results + "/" + encodeURIComponent(token);
      let res = await fetch(url, session.token ? { headers: { Authorization: "Bearer " + session.token } } : {});
      if (res.status === 401) res = await fetch(url);
      const d = await res.json().catch(() => null);
      if (!res.ok) throw new Error(d && d.detail === "INVALID_RESULT_TOKEN" ? "This result link is not valid." : errMsg(d, res.status));
      return d;
    }
    async function load() {
      try {
        const d = await get();
        state.textContent = "";
        if (d.analysis_status === "pending" || d.analysis_status === "processing") {
          state.textContent = "Your CV is still being analysed. This page refreshes on its own.";
          timer = setTimeout(load, 8000); return;
        }
        if (d.analysis_status === "failed") { state.textContent = "We couldn't analyse your CV. The recruiter can still see your application."; return; }
        let html = "";
        if (d.feedback_available) {
          html += card("Match: " + (d.score != null ? d.score + " / 100" : "") + " (" + esc(d.match_level || "") + ")", '<p class="mt-2 text-sm text-gray-700">' + esc(d.reason || "") + "</p>");
          if (d.guidance && d.guidance.length) html += card("How to improve", list(d.guidance));
          if (d.skills && d.skills.length) html += card("Skills we found", list(d.skills));
          if (d.experience && d.experience.length) html += card("Experience we found", list(d.experience));
        } else if (!d.feedback_enabled) {
          html += card("Feedback", '<p class="mt-2 text-sm text-gray-600">This recruiter has not turned on applicant feedback for this job.</p>');
        } else {
          html += card("Feedback", '<p class="mt-2 text-sm text-gray-600">Log in with the account linked to this application to see your score and feedback.</p><a class="mt-3 inline-block text-sm text-brand underline" href="/login.html">Log in</a>');
        }
        if (d.questions && d.questions.length) html += card("Interview questions to practise", list(d.questions));
        out.innerHTML = html;
      } catch (e) { state.textContent = e.message; state.classList.add("text-red-600"); }
    }
    if (!token) state.textContent = "This result link is incomplete."; else load();
  </script>
</body>
</html>
