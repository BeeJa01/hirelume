<div class="min-h-screen lg:grid lg:grid-cols-[270px_1fr]"><aside class="hidden border-r border-line bg-white px-5 py-6 lg:sticky lg:top-0 lg:flex lg:h-screen lg:flex-col"><a href="public-job-page.html" class="px-2 font-display text-xl font-bold">Hire<span class="text-brand">Lume</span></a><p class="mt-8 px-2 text-xs font-semibold text-mute">Your application</p><ol id="steps" class="mt-4 space-y-6 px-2"></ol><p class="mt-auto flex items-start gap-2 px-2 text-xs text-mute"><svg class="icon size-4 shrink-0" aria-hidden="true"><use href="#i-shield"/></svg> No account needed to apply. Your CV is only shared with this recruiter.</p></aside><div class="min-w-0"><header class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-line bg-white/90 px-5 py-3.5 backdrop-blur sm:px-8"><p class="flex min-w-0 items-center gap-2 text-sm text-mute"><a id="crumbCo" href="public-job-page.html" class="truncate hover:text-slate-900">Jobs</a><span aria-hidden="true">&rsaquo;</span><a id="crumbTitle" href="public-job-page.html" class="truncate hover:text-slate-900">Job</a><span aria-hidden="true">&rsaquo;</span><strong class="truncate font-semibold text-slate-900">Application sent</strong></p><div class="flex items-center gap-3"><button type="button" aria-label="Help" class="grid size-9 place-items-center rounded-lg border border-line text-mute"><svg class="icon size-5" aria-hidden="true"><use href="#i-help"/></svg></button><a href="login.html" class="rounded-lg border border-line px-3 py-1.5 text-sm font-medium hover:bg-slate-50">Log in</a></div></header><p id="stepNow" class="px-5 pt-4 text-xs font-semibold text-mute lg:hidden"></p><main class="mx-auto max-w-2xl px-5 py-12"><section class="rounded-2xl border border-line bg-white p-8 text-center sm:p-10"><span class="mx-auto grid size-16 place-items-center rounded-full bg-green-50 text-ok"><svg class="icon size-8" aria-hidden="true"><use href="#i-tick"/></svg></span>
<h1 class="mt-5 font-display text-2xl font-bold sm:text-3xl">Application received</h1>
<p id="msg" class="mx-auto mt-2 max-w-md text-sm leading-relaxed text-mute"></p>
<div class="mt-5 flex flex-wrap items-center justify-center gap-2 text-xs font-semibold"><span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1.5 text-slate-700"><svg class="icon size-3.5" aria-hidden="true"><use href="#i-lock"/></svg> CV locked</span><span id="chipTitle" class="rounded-full bg-soft px-3 py-1.5 text-brand">Your application</span></div>
<p id="status" role="status" class="mt-6 flex items-center justify-center gap-2 text-xs text-mute"><span class="size-3.5 animate-spin rounded-full border-2 border-line border-t-brand motion-reduce:animate-none"></span><span id="statusText">Our AI is reading your CV...</span></p></section></main></div></div><script src="api.js"></script><script>var STEPS=[["Read the job","See what the role needs"],["Your details","Name, email and phone"],["Upload your CV","PDF or Word"],["Consent and submit","Review and send"]];
function renderSteps(st){document.getElementById("steps").innerHTML=STEPS.map(function(s,i){var d=st[i],c=d==="done"?"bg-ok text-white":d==="cur"?"bg-brand text-white":"bg-slate-100 text-mute";
return '<li class="flex items-start gap-3"><span class="grid size-8 shrink-0 place-items-center rounded-full text-xs font-semibold '+c+'">'+(d==="done"?'<svg class="icon size-4"><use href="#i-tick"/></svg>':i+1)+'</span><span class="leading-tight"><span class="block text-sm font-medium'+(d==="todo"?" text-mute":"")+'">'+s[0]+'</span><span class="text-xs text-mute">'+s[1]+'</span></span></li>';}).join("");
var cur=st.indexOf("cur"),m=document.getElementById("stepNow");if(m)m.textContent="Step "+(cur<0?4:cur+1)+" of 4";}
var $ = function (id) { return document.getElementById(id); };
var app = {}; try { app = JSON.parse(sessionStorage.getItem("hlApp")) || {}; } catch (e) {}
var first = (app.name || "").split(" ")[0], company = "";
renderSteps(["done", "done", "done", "done"]);
function setMsg() { $("msg").textContent = "Thank you" + (first ? ", " + first : "") + ". " + (company || "The recruiter") + " will review your application and make the decision."; }
setMsg();
document.querySelectorAll('a[href="public-job-page.html"]').forEach(function (a) { a.href = applyFlow.link("public-job-page.html"); });
var jt = applyFlow.jobToken(), rt = applyFlow.resultToken();
if (jt) applyFlow.getJob(jt).then(function (j) {
  company = j.company;
  if (j.title) { $("chipTitle").textContent = j.title; $("crumbTitle").textContent = j.title; }
  if (j.company) $("crumbCo").textContent = "Jobs at " + j.company;
  setMsg();
}).catch(function () {});
function stopSpinner() { document.querySelector("#status span").classList.add("hidden"); }
// Flowchart: "AI analysis successful?" No -> stay here, analysis retries in the background
function showWaiting() { stopSpinner(); $("statusText").textContent = "We could not read your CV just yet. We will keep trying in the background. You do not need to do anything."; }
var stop = null;
if (!rt) { stopSpinner(); $("statusText").textContent = "Your application was received. We could not find your reference on this page, so there is no result to show here."; }
else {
  stop = applyFlow.poll(rt, function (r) {
    if (!r) return;
    if (r.state === "completed") {
      if (stop) stop();
      // Yes + recruiter allows feedback -> AI offer; Yes + no feedback -> interview questions only
      location.href = applyFlow.link(r.feedbackEnabled ? "application-received-ai-offer.html" : "interview-questions-application.html", true);
    } else if (r.state === "failed") { showWaiting(); }
  });
  setTimeout(function () { if (!document.querySelector("#status span").classList.contains("hidden")) showWaiting(); }, 60000);
}
</script></body></html>
